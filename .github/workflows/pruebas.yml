# Lo que tiene que pasar antes de que un cambio entre en `main`.
#
# El proyecto no tenía ninguna comprobación automática: cada fallo se encontraba
# a mano, y varios llevaban semanas escondidos porque nadie volvía a pasar la
# suite entera. Esto no es ceremonia; es la red que impide que los mismos fallos
# vuelvan a entrar.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

# Un empujón nuevo sobre la misma rama cancela el anterior: no tiene sentido
# pagar dos veces por comprobar código que ya quedó atrás.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # La misma imagen que en local: pgvector viene dentro, y sin la extensión
        # la primera migración falla.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atenea
          POSTGRES_PASSWORD: atenea_dev
          POSTGRES_DB: atenea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atenea"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Las migraciones corren sobre la base de partida.
      DATABASE_URL: postgresql+psycopg://atenea:atenea_dev@localhost:5432/atenea
      # Las pruebas usan la suya, y `tests/conftest.py` la crea si no existe. Sin
      # esta variable el conftest cae a su valor por defecto, que es el puerto 55432
      # del Docker de desarrollo: aquí no hay nada escuchando ahí, y por eso el
      # trabajo de backend llevaba rojo desde el primer día.
      ATENEA_TEST_DATABASE_URL: postgresql+psycopg://atenea:atenea_dev@localhost:5432/atenea_test
      ENVIRONMENT: test
      AI_PROVIDER: mock
      EMBEDDINGS_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # Solo el de desarrollo: se genera incluyendo al de ejecución, así que ya
      # es el conjunto entero. Instalar los dos no hacía daño —las versiones son
      # las mismas— pero invita a creer que son dos listas independientes, y
      # entonces alguien edita una sola.
      #
      # `--require-hashes` no, todavía: el bloqueo no lleva hashes. Añadirlos es
      # el siguiente escalón y obliga a regenerar con `--generate-hashes`.
      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Estilo
        working-directory: backend
        run: ruff check .

      - name: Migraciones de cero a head
        working-directory: backend
        run: alembic upgrade head

      - name: Deriva entre modelos y base
        working-directory: backend
        run: alembic check

      - name: Pruebas
        working-directory: backend
        run: python -m pytest -q

  cliente:
    name: Cliente
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Fijada a propósito. `channel: stable` trae la última versión del día, y
          # el cliente se escribió contra la 3.38.2: el análisis pasa en local y
          # fallaba aquí por lints que esa versión todavía no tenía. Una integración
          # continua que no reproduce la máquina de quien programa no sirve de nada.
          # Subirla es una decisión deliberada, con su propio cambio.
          flutter-version: "3.38.2"
          channel: stable
          cache: true

      - name: Dependencias
        working-directory: app
        run: flutter pub get

      # No hay paso de formato a propósito: el cliente se escribió con su propio
      # estilo y `dart format` reescribiría 84 de sus 86 archivos. Adoptarlo es
      # una decisión de una sola vez, y merece su propio cambio, no colarse en el
      # primer flujo de integración continua.
      - name: Análisis
        working-directory: app
        run: flutter analyze lib test

      - name: Pruebas
        working-directory: app
        # La prueba de contrato contra la API viva se salta sola cuando no hay
        # API, así que aquí comprueba lo demás sin fallar por su ausencia.
        run: flutter test

      - name: Compilación web
        working-directory: app
        run: flutter build web --release
