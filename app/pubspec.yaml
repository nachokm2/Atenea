name: atenea
description: "Atenea - RPG de aprendizaje con IA"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.1.0
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  fl_chart: ^1.2.0
  file_picker: ^12.2.0
  provider: ^6.1.5+1
  # Solo para derivar la clave de idempotencia con UUID v5 (SHA-1).
  crypto: ^3.0.6
  # El recordatorio del propio teléfono.
  #
  # El servidor ya decide a quién avisar y cuándo —avisos.py y planificador.py,
  # con horas de silencio, topes y claves de idempotencia— y lo escribe en la
  # bandeja. Lo que faltaba era el último metro: que algo suene con la app
  # cerrada. Eso no pide un servicio de push, pide una alarma local.
  #
  # `timezone` no es opcional ni decorativa: `zonedSchedule` exige un
  # `TZDateTime`, y `flutter_timezone` es lo único que sabe en qué zona está el
  # teléfono de verdad. Sin ella, `tz.local` es UTC y la repetición diaria se
  # desfasa en cada cambio de horario.
  #
  # Ojo al compilar: `flutter_local_notifications` usa `java.time` y el
  # `minSdk` de Flutter es 24, así que sin el desugaring de
  # `android/app/build.gradle.kts` el APK no compila. El fallo aparece tarde y
  # no menciona este paquete.
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Reloj virtual: las pruebas de la cola de celebraciones comprueban el tope
  # de 2,4 s sin esperar 2,4 s de verdad.
  fake_async: ^1.3.3

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Arte del Reino. Las ilustraciones se preparan desde los originales con
  # `python scripts/preparar_arte.py`: recorta el fondo, ajusta el tamaño y
  # guarda en WebP con transparencia real.
  assets:
    - assets/arte/personajes/
    - assets/arte/items/cabeza/
    - assets/arte/items/cuerpo/
    - assets/arte/items/capa/
    - assets/arte/items/botas/
    - assets/arte/items/guantes/
    - assets/arte/items/arma/
    - assets/arte/items/accesorio/
    - assets/arte/items/cabello/

    # Arte por capas, que es otra cosa que las ilustraciones de arriba: se
    # genera con `python scripts/vestir.py` y se trae con
    # `python scripts/exportar_capas.py`. No pasa por `preparar_arte.py`, que
    # convertiría a RGB y recortaría al contenido: una capa vive justo de lo
    # contrario, alfa alrededor y el mismo lienzo de 1024×1024 para todas.
    #
    # `cuerpos/` lleva una figura desnuda por personaje, porque cada una
    # conserva su cara. Las piezas van por familia y no por figura: midiendo las
    # seis siluetas, dentro de una familia el cuerpo es el mismo con ±10 px.
    #
    # Una línea por carpeta, y no `assets/arte/capas/` a secas: las entradas de
    # directorio de Flutter **no son recursivas**, y una sola no empaquetaría
    # nada de lo que hay dentro.
    - assets/arte/capas/cuerpos/
    - assets/arte/capas/masculino/
    - assets/arte/capas/femenino/
    # La figura simplificada del mundo caminable (docs/planes/mundo-caminable.md,
    # Fase D): piloto real de 1 Orden × 1 familia, 2 poses (el resto de cada
    # ciclo repite las mismas dos). Una carpeta por Orden, misma razón que
    # arriba: las entradas de directorio no son recursivas.
    - assets/arte/mundo/masculino/acero/
    # El terreno ilustrado del mundo caminable (Parte A, `terreno.dart`) va
    # acá, `assets/arte/mundo/terreno/` — se agrega a esta lista recién en la
    # Fase T2, junto con la primera lámina real: una carpeta declarada sin
    # contenido es una advertencia de `flutter analyze`.

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
