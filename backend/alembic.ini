# Configuración de Alembic para Atenea.
#
# La URL de conexión NO se escribe aquí: `alembic/env.py` la toma de
# `app.core.config.settings.database_url` (12-factor), que a su vez lee
# la variable de entorno DATABASE_URL o el `.env` de la raíz del repositorio.
#
# Uso habitual (desde backend/):
#   alembic upgrade head
#   alembic downgrade base
#   alembic revision --autogenerate -m "descripcion"

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Nombre de archivo de las revisiones: 0001_esquema_inicial.py, 0002_….py
file_template = %%(rev)s_%%(slug)s

# Fechas en UTC dentro de las revisiones generadas.
timezone = UTC

# Deliberadamente vacío: la URL la inyecta env.py desde settings.
sqlalchemy.url =

[post_write_hooks]
# Sin ganchos: el formateo de las migraciones se hace a mano con `ruff format`
# (o `make format`) para que `alembic revision` no falle cuando ruff no está
# instalado en el intérprete que ejecuta alembic.
hooks =

# ---------------------------------------------------------------------------
# Registro
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
